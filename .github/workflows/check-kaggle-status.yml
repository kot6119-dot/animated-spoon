name: Check Kaggle LTX Video Studio status

on:
  push:
    paths:
      - 'diagnostics/check-kaggle-status.txt'

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kaggle CLI
        run: python -m pip install --upgrade six kaggle
      - name: Read Kaggle kernel status and logs
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "Missing KAGGLE_API_TOKEN secret."
            exit 1
          fi
          echo "=== KERNEL STATUS ==="
          kaggle kernels status digitalstudio2026/ltx-video-studio || true
          echo "=== RECENT KERNEL LOGS ==="
          kaggle kernels logs digitalstudio2026/ltx-video-studio 2>&1 | tail -n 180 || true
