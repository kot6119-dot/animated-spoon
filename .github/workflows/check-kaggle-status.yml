name: Check Kaggle LTX Video Studio status

on:
  push:
    paths:
      - 'diagnostics/check-kaggle-status.txt'

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kaggle CLI
        run: python -m pip install --upgrade six kaggle
      - name: Inspect known Kaggle GPU kernels
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "Missing KAGGLE_API_TOKEN secret."
            exit 1
          fi
          echo "=== MY KAGGLE KERNELS ==="
          kaggle kernels list --mine --page-size 50 || true
          for KERNEL in digitalstudio2026/ltx-video-studio digitalstudio2026/ltx-hardware-check digitalstudio2026/ltx-video-13b-experiment; do
            echo "=== STATUS: $KERNEL ==="
            kaggle kernels status "$KERNEL" || true
            echo "=== LOGS: $KERNEL ==="
            kaggle kernels logs "$KERNEL" 2>&1 | tail -n 100 || true
          done
