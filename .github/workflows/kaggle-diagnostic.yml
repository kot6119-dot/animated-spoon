name: Безопасная диагностика Kaggle

on:
  workflow_dispatch:
  push:
    paths:
      - 'kaggle-diagnostic/hardware-check.ipynb'
      - '.github/workflows/kaggle-diagnostic.yml'

jobs:
  run-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v4

      - name: Подготовка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установка Kaggle CLI
        run: python -m pip install --upgrade kaggle six

      - name: Проверка секретного ключа
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "Не найден секрет KAGGLE_API_TOKEN."
            exit 1
          fi
          echo "Секретный ключ найден."

      - name: Создать настройки диагностического ноутбука
        run: |
          cat > kaggle-diagnostic/kernel-metadata.json <<'EOF'
          {
            "id": "digitalstudio2026/ltx-hardware-check",
            "title": "ltx-hardware-check",
            "code_file": "hardware-check.ipynb",
            "language": "python",
            "kernel_type": "notebook",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true
          }
          EOF

      - name: Запустить только безопасную диагностику
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          kaggle kernels push -p kaggle-diagnostic
