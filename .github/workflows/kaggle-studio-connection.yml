name: Kaggle Studio connection
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kaggle-studio-connection.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade kaggle six
      - name: Check existing notebook
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: kaggle kernels status digitalstudio2026/ltx-video-studio-2

