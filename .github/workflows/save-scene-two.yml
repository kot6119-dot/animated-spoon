name: Save scene two from completed render

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/save-scene-two.yml"

permissions:
  actions: read
  contents: write

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download the verified render
        uses: actions/download-artifact@v4
        with:
          name: final-video-iphone-final
          path: downloaded
          repository: kot6119-dot/animated-spoon
          run-id: 44908864895
          github-token: ${{ github.token }}

      - name: Save as scene two
        run: |
          mkdir -p remotion/public/videos
          cp downloaded/final-video-iPhone-compatible.mp4 remotion/public/videos/scene-two.mp4
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add remotion/public/videos/scene-two.mp4
          git commit -m "[skip ci] Save scene two"
          git push
