name: Studio reporting smoke test
on:
  push:
    paths:
      - '.github/workflows/studio-report-test.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo 'CPU-only reporting test' > studio-test.txt
      - uses: actions/upload-artifact@v4
        id: test
        with:
          name: studio-report-test
          path: studio-test.txt
      - env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.test.outputs.artifact-id }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=success -f context="studio/report-test" -f description="Test artifact ID: $ARTIFACT_ID" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
