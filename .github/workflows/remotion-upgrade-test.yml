name: Test Remotion upgrade branch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/remotion-upgrade-test.yml'

permissions:
  contents: read

jobs:
  verify-remotion:
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated upgrade branch
        uses: actions/checkout@v4
        with:
          ref: test/remotion-4.0.544

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: Install dependencies
        working-directory: remotion
        run: npm install

      - name: Confirm installed versions
        working-directory: remotion
        run: |
          npm ls remotion @remotion/cli
          node -e "console.log('Remotion:', require('remotion/package.json').version); console.log('CLI:', require('@remotion/cli/package.json').version)"

      - name: Bundle project and list compositions
        working-directory: remotion
        run: npx remotion compositions src/index.jsx
