name: Search and download videos from Internet Archive (no API key)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/VIDEO_REQUEST.txt"

permissions:
  contents: write

jobs:
  download-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Search Internet Archive and download openly licensed MP4 clips
        shell: bash
        run: |
          set -euo pipefail
          QUERY="$(sed -n 's/^query=//p' .github/VIDEO_REQUEST.txt | head -n 1)"
          COUNT="$(sed -n 's/^count=//p' .github/VIDEO_REQUEST.txt | head -n 1)"
          MIN_WIDTH="$(sed -n 's/^min_width=//p' .github/VIDEO_REQUEST.txt | head -n 1)"
          MIN_HEIGHT="$(sed -n 's/^min_height=//p' .github/VIDEO_REQUEST.txt | head -n 1)"
          [[ -n "$QUERY" ]] || { echo "::error::Missing query in VIDEO_REQUEST.txt"; exit 1; }
          COUNT="${COUNT:-1}"
          mkdir -p VIDEO_LIBRARY
          export QUERY COUNT MIN_WIDTH MIN_HEIGHT
          node <<'NODE'
          const fs = require('node:fs/promises');
          const path = require('node:path');

          const allowedLicense = value => {
            const s = String(value || '').toLowerCase();
            return s.includes('creativecommons.org/licenses/by/') ||
              s.includes('creativecommons.org/licenses/by-sa/') ||
              s.includes('creativecommons.org/publicdomain/zero/') ||
              s.includes('creativecommons.org/publicdomain/mark/');
          };

          const safeName = value => String(value || 'internet-archive-video')
            .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 55) || 'internet-archive-video';

          async function getJson(url) {
            const response = await fetch(url, { headers: { 'User-Agent': 'IMPERIAL-LUXE-Video-Library/1.0' } });
            const body = await response.text();
            if (!response.ok) throw new Error('HTTP ' + response.status + ' from ' + url + ': ' + body.slice(0, 500));
            return JSON.parse(body);
          }

          async function main() {
            const queryText = process.env.QUERY.trim();
            const search = new URL('https://archive.org/advancedsearch.php');
            search.searchParams.set('q', 'mediatype:movies AND (' + queryText.split(/\\s+/).map(x => 'title:' + x + ' OR description:' + x).join(' AND ') + ')');
            search.searchParams.append('fl[]', 'identifier');
            search.searchParams.append('fl[]', 'title');
            search.searchParams.set('rows', '50');
            search.searchParams.set('output', 'json');

            const results = await getJson(search);
            const docs = results.response?.docs || [];
            console.log('Internet Archive search results: ' + docs.length);
            let downloaded = 0;

            for (const doc of docs) {
              if (downloaded >= Number(process.env.COUNT || 1)) break;
              const id = doc.identifier;
              if (!id) continue;
              const item = await getJson('https://archive.org/metadata/' + encodeURIComponent(id));
              const meta = item.metadata || {};
              const license = meta.licenseurl || meta.license || doc.licenseurl || '';
              if (!allowedLicense(license)) {
                console.log('Skipped ' + id + ': no approved open license listed.');
                continue;
              }

              const files = (item.files || []).filter(f =>
                String(f.name || '').toLowerCase().endsWith('.mp4') &&
                (f.source === 'original' || !f.source) &&
                Number(f.size || 0) > 100000
              );
              const file = files.find(f =>
                (!process.env.MIN_WIDTH || !f.width || Number(f.width) >= Number(process.env.MIN_WIDTH)) &&
                (!process.env.MIN_HEIGHT || !f.height || Number(f.height) >= Number(process.env.MIN_HEIGHT))
              );
              if (!file) {
                console.log('Skipped ' + id + ': no suitable MP4 file.');
                continue;
              }

              const url = 'https://archive.org/download/' + encodeURIComponent(id) + '/' + encodeURIComponent(file.name);
              const response = await fetch(url, { headers: { 'User-Agent': 'IMPERIAL-LUXE-Video-Library/1.0' } });
              if (!response.ok) {
                console.log('Skipped ' + id + ': download HTTP ' + response.status);
                continue;
              }
              const bytes = Buffer.from(await response.arrayBuffer());
              if (bytes.length < 100000) {
                console.log('Skipped ' + id + ': downloaded file is unexpectedly small.');
                continue;
              }

              const base = 'archive-' + safeName(id + '-' + (meta.title || doc.title));
              await fs.writeFile(path.join('VIDEO_LIBRARY', base + '.mp4'), bytes);
              const metadata = {
                source: 'Internet Archive',
                identifier: id,
                title: meta.title || doc.title || '',
                creator: meta.creator || '',
                source_page: 'https://archive.org/details/' + id,
                downloaded_file: base + '.mp4',
                file_name: file.name,
                width: file.width || null,
                height: file.height || null,
                license: license,
                note: 'Check the item page and license terms before publishing or commercial use.'
              };
              await fs.writeFile(path.join('VIDEO_LIBRARY', base + '.json'), JSON.stringify(metadata, null, 2) + '\n');
              console.log('Downloaded ' + base + '.mp4 (' + bytes.length + ' bytes)');
              console.log('License: ' + license);
              downloaded++;
            }

            if (!downloaded) throw new Error('No MP4 clips with an approved open license were found for: ' + queryText);
          }

          main().catch(error => { console.error('::error::' + error.message); process.exit(1); });
          NODE

      - name: Commit downloaded stock videos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VIDEO_LIBRARY/
          if git diff --cached --quiet; then
            echo "No new video files to commit."
            exit 0
          fi
          git commit -m "Add openly licensed videos from Internet Archive"
          git push
