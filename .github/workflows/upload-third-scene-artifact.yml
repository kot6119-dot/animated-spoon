name: Upload third scene artifact

on:
  push:
    paths:
      - ".github/workflows/upload-third-scene-artifact.yml"

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Upload existing assembled video
        uses: actions/upload-artifact@v4
        with:
          name: third-scene-mp4
          path: remotion/public/videos/03-scena-tretya.mp4
          if-no-files-found: error
          retention-days: 1
