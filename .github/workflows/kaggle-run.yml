name: Запуск ноутбука Kaggle

on:
  workflow_dispatch:

jobs:
  run-kaggle:
    runs-on: ubuntu-latest
    steps:
      - name: Подготовка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установка Kaggle CLI
        run: python -m pip install --upgrade kaggle six

      - name: Проверка секретного ключа
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "Не найден секрет KAGGLE_API_TOKEN."
            exit 1
          fi
          echo "Секретный ключ найден."

      - name: Скачать исходный ноутбук
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p kaggle-notebook
          kaggle kernels pull digitalstudio2026/notebook190c40d32f -p kaggle-notebook

      - name: Повторно отправить ноутбук на выполнение
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          kaggle kernels push -p kaggle-notebook
