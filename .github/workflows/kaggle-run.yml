name: Запуск ноутбука Kaggle

on:
  workflow_dispatch:
  push:
    paths:
      - 'kaggle-notebook/ltx-video.ipynb'
      - '.github/workflows/kaggle-run.yml'

jobs:
  run-kaggle:
    runs-on: ubuntu-latest
    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v4

      - name: Подготовка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установка Kaggle CLI
        run: python -m pip install --upgrade kaggle six

      - name: Проверка секретного ключа
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "Не найден секрет KAGGLE_API_TOKEN."
            exit 1
          fi
          echo "Секретный ключ найден."

      - name: Диагностика состояния Kaggle без запуска и удаления ноутбука
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          echo "===== СТАТУС ЦЕЛЕВОГО НОУТБУКА ====="
          kaggle kernels status digitalstudio2026/notebook190c40d32f || true
          echo "===== СПИСОК МОИХ KERNELS ====="
          kaggle kernels list --mine --page-size 100 --csv || true
          echo "===== ПРОВЕРКА ДОСТУПНЫХ MCP-ОПЕРАЦИЙ ====="
          python - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request(
              "https://www.kaggle.com/mcp",
              data=json.dumps({"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}).encode(),
              headers={
                  "Authorization": "Bearer " + os.environ["KAGGLE_API_TOKEN"],
                  "Content-Type": "application/json",
                  "Accept": "application/json, text/event-stream",
                  "MCP-Protocol-Version": "2025-11-25"
              },
              method="POST"
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = response.read().decode("utf-8", "replace")
              print("MCP response received.")
              for line in body.splitlines():
                  if "cancel_notebook_session" in line or "get_notebook_session_status" in line:
                      print(line[:1200])
          except Exception as e:
              print("MCP diagnostic unavailable:", type(e).__name__, str(e)[:300])
          PY

      - name: Отправить ноутбук на выполнение только при изменении самого ноутбука
        if: contains(github.event.head_commit.modified, 'kaggle-notebook/ltx-video.ipynb')
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p kaggle-notebook
          cat > kaggle-notebook/kernel-metadata.json <<'EOF'
          {
            "id": "digitalstudio2026/notebook190c40d32f",
            "title": "notebook190c40d32f",
            "code_file": "ltx-video.ipynb",
            "language": "python",
            "kernel_type": "notebook",
            "is_private": false,
            "enable_gpu": true,
            "enable_internet": true
          }
          EOF
          kaggle kernels push -p kaggle-notebook
