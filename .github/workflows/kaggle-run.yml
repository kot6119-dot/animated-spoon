name: Удаление старого ноутбука Kaggle

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kaggle-run.yml'

jobs:
  delete-kaggle-notebook:
    runs-on: ubuntu-latest
    steps:
      - name: Установить Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Удалить старый ноутбук Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "Не найден секрет KAGGLE_API_TOKEN."
            exit 1
          fi
          kaggle kernels delete digitalstudio2026/notebook190c40d32f --yes
          echo "Команда удаления отправлена Kaggle."
