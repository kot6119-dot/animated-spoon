name: Render smartphone scene

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/render-smartphone.yml'
      - 'remotion/src/Root.jsx'
      - 'remotion/public/videos/I2V Камера плавно прибли_11-10_23_04_17.mp4'

jobs:
  render-smartphone:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: remotion
        run: npm install

      - name: Install Remotion browser
        working-directory: remotion
        run: npx remotion browser ensure

      - name: Render cat video with glasses effect
        working-directory: remotion
        run: npx remotion render src/index.jsx Main out/smartphone-notification.mp4 --codec=h264 --gl=swangle --preferred-effect-backend=webgl2

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: cat-video-glasses-effect
          path: remotion/out/smartphone-notification.mp4
          if-no-files-found: error
