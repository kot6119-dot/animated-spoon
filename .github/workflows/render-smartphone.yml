name: Render smartphone scene

on:
  workflow_dispatch:

jobs:
  render-smartphone:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: Install dependencies
        working-directory: remotion
        run: npm ci

      - name: Install Remotion browser
        working-directory: remotion
        run: npx remotion browser install

      - name: Render smartphone scene only
        working-directory: remotion
        run: npm run render-smartphone

      - name: Upload smartphone video
        uses: actions/upload-artifact@v4
        with:
          name: smartphone-notification
          path: remotion/out/smartphone-notification.mp4
          if-no-files-found: error
