name: Получить результат GPU-диагностики
on:
  push:
    paths:
      - ".github/workflows/kaggle-diagnostic-status.yml"
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Установить Kaggle CLI
        run: python -m pip install --upgrade kaggle six
      - name: Получить статус и журнал диагностики
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          kaggle kernels status digitalstudio2026/ltx-hardware-check || true
          kaggle kernels logs digitalstudio2026/ltx-hardware-check || true
