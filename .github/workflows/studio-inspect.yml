name: Studio notebook inspection
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/studio-inspect.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade kaggle six
      - name: Retrieve notebook source
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: kaggle kernels pull digitalstudio2026/ltx-video-studio-2 -p studio-source -m
      - uses: actions/upload-artifact@v4
        with:
          name: studio-source
          path: studio-source/
