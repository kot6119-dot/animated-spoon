name: Download sounds with SFXMint

on:
  workflow_dispatch:
    inputs:
      category:
        description: Where to save the sound files
        required: true
        type: choice
        options:
          - Notifications
          - Effects
          - Transitions
      sounds:
        description: "SFXMint role names, separated by spaces"
        required: true
        type: string
  push:
    paths:
      - ".github/SFXMINT_REQUEST.txt"

permissions:
  contents: write

jobs:
  download-sounds:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and download with SFXMint
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOUND_NAMES: ${{ inputs.sounds }}
          CATEGORY_INPUT: ${{ inputs.category }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "push" ]]; then
            REQUEST_FILE=".github/SFXMINT_REQUEST.txt"
            CATEGORY="$(sed -n 's/^category=//p' "$REQUEST_FILE" | head -n 1)"
            QUERY="$(sed -n 's/^query=//p' "$REQUEST_FILE" | head -n 1)"
            if [[ -z "$QUERY" ]]; then
              echo "The request file has no query."
              exit 1
            fi
            case "$CATEGORY" in
              Notifications|Effects|Transitions) TARGET_DIR="SOUND_LIBRARY/$CATEGORY" ;;
              *) echo "Unsupported category: $CATEGORY"; exit 1 ;;
            esac
            echo "Searching SFXMint for: $QUERY"
            npx --yes sfxmint@0.2.12 search "$QUERY" --out "$TARGET_DIR" --format mp3 --json
          else
            CATEGORY="$CATEGORY_INPUT"
            case "$CATEGORY" in
              Notifications|Effects|Transitions) TARGET_DIR="SOUND_LIBRARY/$CATEGORY" ;;
              *) echo "Unsupported category: $CATEGORY"; exit 1 ;;
            esac
            read -r -a names <<< "$SOUND_NAMES"
            if [[ "${#names[@]}" -lt 1 ]]; then
              echo "Enter at least one SFXMint role name."
              exit 1
            fi
            for name in "${names[@]}"; do
              if [[ ! "$name" =~ ^[a-zA-Z0-9][a-zA-Z0-9-]{0,49}$ ]]; then
                echo "Invalid role name: $name"
                exit 1
              fi
            done
            echo "Downloading named roles into $TARGET_DIR"
            npx --yes sfxmint@0.2.12 add "${names[@]}" --out "$TARGET_DIR" --format mp3
          fi

      - name: Save downloaded files to the project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOUND_LIBRARY/
          if git diff --cached --quiet; then
            echo "No new sound files were added."
            exit 0
          fi
          git commit -m "Add SFXMint sound effects"
          git push
