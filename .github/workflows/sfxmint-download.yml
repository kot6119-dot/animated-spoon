name: Download sounds with SFXMint

on:
  push:
    paths:
      - ".github/SFXMINT_REQUEST.txt"

permissions:
  contents: write

jobs:
  download-sounds:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Search and download an MP3 from the official SFXMint API
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_FILE=".github/SFXMINT_REQUEST.txt"
          CATEGORY="$(sed -n 's/^category=//p' "$REQUEST_FILE" | head -n 1)"
          QUERY="$(sed -n 's/^query=//p' "$REQUEST_FILE" | head -n 1)"

          case "$CATEGORY" in
            Notifications|Effects|Transitions) TARGET_DIR="SOUND_LIBRARY/$CATEGORY" ;;
            *) echo "::error::Unsupported category: $CATEGORY"; exit 1 ;;
          esac
          if [[ -z "$QUERY" ]]; then
            echo "::error::The request file has no query."
            exit 1
          fi

          export CATEGORY QUERY TARGET_DIR
          node <<'NODE'
          const fs = require('node:fs/promises');
          const path = require('node:path');
          const crypto = require('node:crypto');

          async function main() {
            const endpoint = new URL('https://sfxmint.com/api/v1/search');
            endpoint.searchParams.set('q', process.env.QUERY);
            endpoint.searchParams.set('limit', '5');
            endpoint.searchParams.set('format', 'mp3');

            console.log('Searching SFXMint:', process.env.QUERY);
            const searchResponse = await fetch(endpoint);
            const searchText = await searchResponse.text();
            if (!searchResponse.ok) {
              console.error('SFXMint search failed:', searchResponse.status, searchText.slice(0, 2000));
              process.exit(1);
            }

            let payload;
            try { payload = JSON.parse(searchText); }
            catch { throw new Error('SFXMint returned invalid JSON: ' + searchText.slice(0, 1000)); }

            const results = Array.isArray(payload) ? payload
              : Array.isArray(payload.results) ? payload.results
              : Array.isArray(payload.sounds) ? payload.sounds
              : Array.isArray(payload.candidates) ? payload.candidates
              : [];

            const sound = results.find(item => item && typeof item.mp3_url === 'string' && item.mp3_url.startsWith('https://'));
            if (!sound) {
              console.error('No downloadable MP3 found. API response:', JSON.stringify(payload).slice(0, 5000));
              process.exit(1);
            }

            await fs.mkdir(process.env.TARGET_DIR, { recursive: true });
            const slug = String(sound.slug || sound.id || 'sfxmint-sound').replace(/[^a-zA-Z0-9_-]/g, '-');
            let filename = slug + '.mp3';
            let outputPath = path.join(process.env.TARGET_DIR, filename);
            let suffix = 2;
            while (true) {
              try { await fs.access(outputPath); outputPath = path.join(process.env.TARGET_DIR, slug + '-' + suffix++ + '.mp3'); }
              catch { break; }
            }

            console.log('Downloading:', sound.title || slug);
            const audioResponse = await fetch(sound.mp3_url);
            if (!audioResponse.ok) {
              const body = await audioResponse.text();
              throw new Error('MP3 download failed: HTTP ' + audioResponse.status + ' ' + body.slice(0, 1000));
            }
            const bytes = Buffer.from(await audioResponse.arrayBuffer());
            const isMp3 = bytes.length > 3 &&
              (bytes.subarray(0, 3).toString() === 'ID3' ||
               (bytes[0] === 0xff && (bytes[1] & 0xe0) === 0xe0));
            if (!isMp3) throw new Error('SFXMint response does not look like an MP3 file (' + bytes.length + ' bytes).');

            await fs.writeFile(outputPath, bytes);
            const sha256 = crypto.createHash('sha256').update(bytes).digest('hex');
            const manifestPath = path.join(process.env.TARGET_DIR, 'SFXMINT_MANIFEST.json');
            let manifest = [];
            try { manifest = JSON.parse(await fs.readFile(manifestPath, 'utf8')); }
            catch (error) { if (error.code !== 'ENOENT') throw error; }
            if (!Array.isArray(manifest)) manifest = [];
            manifest.push({
              file: path.basename(outputPath),
              title: sound.title || slug,
              source_url: sound.page_url || sound.url || null,
              mp3_url: sound.mp3_url,
              license: sound.license || 'CC0 1.0',
              sha256,
              bytes: bytes.length,
              requested_as: process.env.QUERY
            });
            await fs.writeFile(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
            console.log('Saved and verified:', outputPath, '(' + bytes.length + ' bytes, SHA-256 ' + sha256 + ')');
          }

          main().catch(error => {
            console.error('::error::' + error.message);
            process.exit(1);
          });
          NODE

      - name: Commit downloaded sound files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOUND_LIBRARY/
          if git diff --cached --quiet; then
            echo "No new sound files were added."
            exit 0
          fi
          git commit -m "Add SFXMint sound effects"
          git push
