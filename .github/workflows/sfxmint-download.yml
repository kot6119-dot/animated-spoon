name: Search sounds with SFXMint (preview only)

on:
  push:
    paths:
      - ".github/SFXMINT_REQUEST.txt"

permissions:
  contents: write

jobs:
  search-sounds:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Search SFXMint and save preview links (no downloads)
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_FILE=".github/SFXMINT_REQUEST.txt"
          CATEGORY="$(sed -n 's/^category=//p' "$REQUEST_FILE" | head -n 1)"
          QUERY="$(sed -n 's/^query=//p' "$REQUEST_FILE" | head -n 1)"
          REQUEST_ID="$(sed -n 's/^request_id=//p' "$REQUEST_FILE" | head -n 1)"
          case "$CATEGORY" in
            Notifications|Effects|Transitions) ;;
            *) echo "::error::Unsupported category: $CATEGORY"; exit 1 ;;
          esac
          if [[ -z "$QUERY" ]]; then
            echo "::error::The request file has no query."
            exit 1
          fi
          export CATEGORY QUERY REQUEST_ID
          node <<'NODE'
          const fs = require('node:fs/promises');
          async function main() {
            const endpoint = new URL('https://sfxmint.com/api/v1/search');
            endpoint.searchParams.set('q', process.env.QUERY);
            endpoint.searchParams.set('limit', '10');
            endpoint.searchParams.set('format', 'mp3');
            console.log('Searching SFXMint:', process.env.QUERY);
            const response = await fetch(endpoint);
            const body = await response.text();
            if (!response.ok) throw new Error('SFXMint search failed: HTTP ' + response.status + ' ' + body.slice(0, 2000));
            let payload;
            try { payload = JSON.parse(body); }
            catch { throw new Error('SFXMint returned invalid JSON: ' + body.slice(0, 1000)); }
            const results = Array.isArray(payload) ? payload
              : Array.isArray(payload.results) ? payload.results
              : Array.isArray(payload.sounds) ? payload.sounds
              : Array.isArray(payload.candidates) ? payload.candidates : [];
            const candidates = results.filter(x => x && typeof x.mp3_url === 'string' && x.mp3_url.startsWith('https://'))
              .slice(0, 10).map(x => ({
                title: x.title || x.slug || x.id || 'Untitled sound',
                page_url: x.page_url || x.url || null,
                mp3_url: x.mp3_url,
                license: x.license || null
              }));
            const preview = {
              request_id: process.env.REQUEST_ID,
              category: process.env.CATEGORY,
              query: process.env.QUERY,
              downloaded: false,
              candidates
            };
            await fs.writeFile('.github/SFXMINT_PREVIEW.json', JSON.stringify(preview, null, 2) + '\\n');
            console.log('Found ' + candidates.length + ' preview candidates. No audio files were downloaded.');
            for (const [i, x] of candidates.entries()) console.log((i + 1) + '. ' + x.title + ' | ' + x.page_url + ' | ' + x.mp3_url);
            if (!candidates.length) throw new Error('No previewable MP3 candidates found.');
          }
          main().catch(e => { console.error('::error::' + e.message); process.exit(1); });
          NODE

      - name: Commit preview list only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/SFXMINT_PREVIEW.json
          if git diff --cached --quiet; then
            echo "No preview list changes."
            exit 0
          fi
          git commit -m "Add SFXMint sound preview candidates"
          git push
