name: Проверить выполнение Kaggle
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/kaggle-status.yml"
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Подготовка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Установка Kaggle CLI
        run: python -m pip install --upgrade kaggle six
      - name: Проверить статус и получить журнал Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "KAGGLE_API_TOKEN secret is missing."
            exit 1
          fi
          echo "=== KAGGLE STATUS ==="
          kaggle kernels status digitalstudio2026/notebook190c40d32f || true
          echo "=== KAGGLE EXECUTION LOG ==="
          kaggle kernels logs digitalstudio2026/notebook190c40d32f || true

