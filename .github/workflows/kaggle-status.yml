name: Проверить выполнение Kaggle
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/kaggle-status.yml"
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Подготовка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Установка Kaggle CLI
        run: python -m pip install --upgrade kaggle six
      - name: Получить живой журнал Kaggle и ссылку Gradio
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -o pipefail
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "KAGGLE_API_TOKEN secret is missing."
            exit 1
          fi
          echo "=== KAGGLE STATUS ==="
          kaggle kernels status digitalstudio2026/notebook190c40d32f || true
          echo "=== LIVE EXECUTION LOG (up to 150 seconds) ==="
          timeout 150s kaggle kernels logs digitalstudio2026/notebook190c40d32f --follow --interval 5 2>&1 | tee /tmp/kaggle-live.log || true
          echo "=== EXTRACT GRADIO URL ==="
          grep -Eo 'https://[A-Za-z0-9-]+\.gradio\.live' /tmp/kaggle-live.log | tail -n 1 | tee /tmp/gradio-url.txt || true
          if [ -s /tmp/gradio-url.txt ]; then
            echo "GRADIO_SHARE_URL=$(cat /tmp/gradio-url.txt)" >> "$GITHUB_OUTPUT"
            echo "PUBLIC_GRADIO_URL=$(cat /tmp/gradio-url.txt)"
          else
            echo "No Gradio share URL appeared in the live log during this check."
            echo "=== LAST LOG LINES ==="
            tail -n 80 /tmp/kaggle-live.log || true
          fi
          echo "=== KAGGLE OUTPUT FILES ==="
          mkdir -p /tmp/kaggle-output
          kaggle kernels output digitalstudio2026/notebook190c40d32f -p /tmp/kaggle-output || true
          find /tmp/kaggle-output -maxdepth 2 -type f -printf '%p (%s bytes)\\n' || true

# Live log streaming enabled to capture demo.share_url from the running Kaggle session.
