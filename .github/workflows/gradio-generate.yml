name: Gradio remote generation
on:
  workflow_dispatch:
  push:
    paths:
      - 'studio-request.json'
permissions:
  contents: read
  statuses: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install gradio_client
      - name: Generate video
        run: |
          python - <<'PY'
          import json, pathlib, shutil
          from gradio_client import Client, handle_file
          r=json.loads(pathlib.Path('studio-request.json').read_text())
          c=Client(r['url'])
          args=r['parameters']
          aspect_aliases = {
              '16:9': '16:9 Landscape',
              '9:16': '9:16 Portrait',
              '4:3': '4:3 Standard',
              '1:1': '1:1 Square',
          }
          if args.get('asp') in aspect_aliases:
              args['asp'] = aspect_aliases[args['asp']]
          duration_aliases = {
              '3': '3s (native)',
              '5': '5s (native)',
              '8': '8s (native)',
              '10': '10s (native)',
              '12': '12s (native)',
              '15': '15s (native)',
              '20': '20s (2 chunks)',
              '25': '25s (3 chunks)',
              '30': '30s (3 chunks)',
          }
          if str(args.get('dur_label')) in duration_aliases:
              args['dur_label'] = duration_aliases[str(args['dur_label'])]
          if args.get('img'):
              args['img']=handle_file(args['img'])
          result=c.predict(api_name='/on_gen', **args)
          print(result)
          def files(x):
              if isinstance(x,str) and x.endswith('.mp4') and pathlib.Path(x).is_file():
                  yield x
              elif isinstance(x,dict):
                  for v in x.values(): yield from files(v)
              elif isinstance(x,(list,tuple)):
                  for v in x: yield from files(v)
          p=next(files(result),None)
          if not p: raise RuntimeError('No MP4 returned')
          shutil.copyfile(p,'studio-result.mp4')
          PY
      - uses: actions/upload-artifact@v4
        id: video
        with:
          name: studio-video
          path: studio-result.mp4
          if-no-files-found: error
      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.video.outputs.artifact-id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          description="Generation did not complete"
          target="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$JOB_STATUS" = success ] && [ -n "$ARTIFACT_ID" ]; then
            state=success
            description="MP4 artifact ID: $ARTIFACT_ID"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context="studio/video" -f description="$description" -f target_url="$target"
