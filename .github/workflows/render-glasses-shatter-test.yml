name: Render glasses shatter test

on:
  push:
    branches:
      - test/remotion-4.0.544
    paths:
      - 'remotion/**'
      - '.github/workflows/render-glasses-shatter-test.yml'

permissions:
  contents: read

jobs:
  render-glasses-shatter-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remotion
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Inspect original source frames
        run: |
          mkdir -p out/source-inspection
          ffprobe -v error -show_entries stream=width,height,r_frame_rate,duration -of default=noprint_wrappers=1 "public/videos/content 3.mp4" > out/source-inspection/source-info.txt
          for t in 0.5 1.0 1.5 2.0 2.5 3.0 4.0 5.0; do
            ffmpeg -y -ss "$t" -i "public/videos/content 3.mp4" -frames:v 1 "out/source-inspection/source-$t.png" >/dev/null 2>&1
          done
      - name: Install dependencies
        run: npm install
      - name: Install Remotion browser
        run: npx remotion browser ensure
      - name: Render only glasses shatter test
        run: npm run render-glasses-shatter-test
      - name: Upload glasses shatter test and source inspection
        uses: actions/upload-artifact@v4
        with:
          name: glasses-shatter-test
          path: |
            remotion/out/glasses-shatter-test.mp4
            remotion/out/source-inspection/
          if-no-files-found: error
