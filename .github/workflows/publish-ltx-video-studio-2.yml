name: Publish new LTX-Video notebook to Kaggle

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public GitHub repository
        uses: actions/checkout@v4

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Push new notebook to Kaggle
        working-directory: .
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "Missing GitHub Actions secret KAGGLE_API_TOKEN"
            exit 1
          fi
          kaggle kernels push -p kaggle-notebook/ltx-video-studio-2
