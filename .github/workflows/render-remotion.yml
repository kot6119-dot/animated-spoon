name: Render Remotion videos

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'remotion/**'
      - '.github/workflows/render-remotion.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remotion
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Remotion browser
        run: npx remotion browser ensure

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render IMPERIAL LUXE vertical Instagram Reel (video and audio)
        run: npm run render-reel

      - name: Export Instagram-ready MP4 (H.264 Main, 1080x1920, 30fps, AAC)
        run: |
          ffmpeg -y -i out/imperial-luxe-reel-video-only.mp4 \
            -map 0:v:0 -map 0:a:0? \
            -vf "scale=1080:1920:flags=lanczos,setsar=1,fps=30,format=yuv420p" \
            -c:v libx264 -profile:v main -level:v 4.0 -preset medium -crf 18 \
            -c:a aac -b:a 192k -ar 48000 -ac 2 \
            -movflags +faststart out/imperial-luxe-instagram-final.mp4

      - name: Upload final IMPERIAL LUXE video
        uses: actions/upload-artifact@v4
        with:
          name: imperial-luxe-final
          path: remotion/out/imperial-luxe-instagram-final.mp4
          if-no-files-found: error
