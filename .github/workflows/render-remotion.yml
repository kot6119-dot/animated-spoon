name: Render Remotion video

on:
  push:
    branches:
      - main
    paths:
      - 'remotion/**'
      - '.github/workflows/render-remotion.yml'
  workflow_dispatch:
    inputs:
      composition_id:
        description: "Remotion composition ID"
        required: true
        default: "Main"
        type: string
      output_name:
        description: "Output file name without extension"
        required: true
        default: "final-video"
        type: string

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remotion
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Confirm Remotion versions
        run: |
          npm ls remotion @remotion/cli
          node -e "const r=require('remotion/package.json').version; const c=require('@remotion/cli/package.json').version; if(r !== '4.0.544' || c !== '4.0.544') process.exit(1); console.log('Remotion and CLI:', r)"

      - name: Install Remotion browser
        run: npx remotion browser ensure

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: List available compositions
        run: npx remotion compositions src/index.jsx

      - name: Render selected composition
        run: npx remotion render src/index.jsx "${{ inputs.composition_id || 'Main' }}" "out/${{ inputs.output_name || 'final-video' }}-video-only.mp4" --codec=h264 --gl=swangle --preferred-effect-backend=webgpu

      - name: Export iPhone-ready MP4 (H.264 Main, 1080x1920, AAC)
        run: |
          ffmpeg -y -i "out/${{ inputs.output_name || 'final-video' }}-video-only.mp4" \
            -map 0:v:0 -map 0:a:0? \
            -vf "scale=1080:1920:flags=lanczos,setsar=1,fps=30,format=yuv420p" \
            -c:v libx264 -profile:v main -level:v 4.0 -preset medium -crf 18 \
            -c:a aac -b:a 192k -ar 48000 -ac 2 \
            -movflags +faststart "out/${{ inputs.output_name || 'final-video' }}-iPhone-compatible.mp4"

      - name: Upload final iPhone-compatible video
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_name || 'final-video' }}-iphone-final
          path: remotion/out/${{ inputs.output_name || 'final-video' }}-iPhone-compatible.mp4
          if-no-files-found: error

      - name: Copy final MP4 into repository video folder
        env:
          OUTPUT_NAME: ${{ inputs.output_name || 'final-video' }}
        run: |
          set -euo pipefail
          if [[ ! "$OUTPUT_NAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid output_name. Use only letters, numbers, dots, underscores, and hyphens."
            exit 1
          fi
          source="out/${OUTPUT_NAME}-iPhone-compatible.mp4"
          destination="public/videos/${OUTPUT_NAME}-iPhone-compatible.mp4"
          test -s "$source"
          mkdir -p public/videos
          cp "$source" "$destination"
          echo "Saved rendered video to remotion/$destination"

      - name: Commit rendered MP4 to repository
        working-directory: .
        env:
          OUTPUT_NAME: ${{ inputs.output_name || 'final-video' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "remotion/public/videos/${OUTPUT_NAME}-iPhone-compatible.mp4"
          if git diff --cached --quiet; then
            echo "Rendered MP4 is already up to date; no commit needed."
          else
            git commit -m "Save rendered video: ${OUTPUT_NAME}"
            git push
          fi
