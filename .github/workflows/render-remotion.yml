name: Render Remotion video

on:
  push:
    branches: [main]
    paths:
      - "remotion/src/Root.jsx"
      - "remotion/public/videos/**"
      - ".github/workflows/render-remotion.yml"
  workflow_dispatch:
    inputs:
      composition_id:
        description: "Remotion composition ID"
        required: true
        default: "Main"
        type: string
      output_name:
        description: "Output file name without extension"
        required: true
        default: "final-video"
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      COMPOSITION_ID: ${{ inputs.composition_id || 'Main' }}
      OUTPUT_NAME: ${{ inputs.output_name || 'final-video' }}
    defaults:
      run:
        working-directory: remotion
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Confirm Remotion versions
        run: |
          npm ls remotion @remotion/cli
          node -e "const r=require('remotion/package.json').version; const c=require('@remotion/cli/package.json').version; if(r !== '4.0.544' || c !== '4.0.544') process.exit(1); console.log('Remotion and CLI:', r)"

      - name: Install Remotion browser
        run: npx remotion browser ensure

      - name: List available compositions
        run: npx remotion compositions src/index.jsx

      - name: Render iPhone-ready MP4 in one encoding pass
        run: |
          npx remotion render src/index.jsx "$COMPOSITION_ID" "out/$OUTPUT_NAME-iPhone-compatible.mp4" \
            --codec=h264 \
            --crf=16 \
            --x264-preset=slow \
            --pixel-format=yuv420p \
            --audio-codec=aac \
            --audio-bitrate=192K \
            --gl=swangle \
            --preferred-effect-backend=webgpu

      - name: Upload final iPhone-ready video
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_NAME }}-iphone-final
          path: remotion/out/${{ env.OUTPUT_NAME }}-iPhone-compatible.mp4
          if-no-files-found: error

      - name: Report output
        run: echo "iPhone-ready MP4 rendered in one encoding pass. Source video and audio files were not changed."
