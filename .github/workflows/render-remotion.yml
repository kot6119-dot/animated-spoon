name: Render Remotion videos

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'remotion/**'
      - '.github/workflows/render-remotion.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remotion
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Remotion browser
        run: npx remotion browser ensure

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Process voice experiment (sexy_official_2)
        run: |
          mkdir -p out
          ffmpeg -y -i public/videos/sexy_official_2.mp3 -af "aresample=44100,asetrate=42777,aresample=44100,equalizer=f=140:t=q:w=1:g=1.2" -c:a libmp3lame -b:a 192k out/sexy_official_2-voice-test.mp3

      - name: Render first video (unchanged laser version)
        run: npm run render

      - name: Render second video (diamonds polish)
        run: npm run render-diamonds

      - name: Render third animation (water hides diamonds)
        run: npm run render-water

      - name: Render fourth scene (smartphone breaking news)
        run: npm run render-smartphone

      - name: Render IMPERIAL LUXE vertical Instagram Reel (video only)
        run: npm run render-reel

      - name: Upload rendered videos, animation, and voice experiment
        uses: actions/upload-artifact@v4
        with:
          name: remotion-videos
          path: |
            remotion/out/bottle-film.mp4
            remotion/out/diamonds-polished.mov
            remotion/out/water-hides-diamonds.mp4
            remotion/out/smartphone-notification.mp4
            remotion/out/imperial-luxe-reel-video-only.mp4
            remotion/out/sexy_official_2-voice-test.mp3
          if-no-files-found: error
