name: Render Remotion video

on:
  push:
    branches: [main]
    paths:
      - "remotion/src/Root.jsx"
  workflow_dispatch:
    inputs:
      composition_id:
        description: "Remotion composition ID"
        required: true
        default: "Main"
        type: string
      output_name:
        description: "Output file name without extension"
        required: true
        default: "final-video"
        type: string

permissions:
  contents: write
  actions: write

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      COMPOSITION_ID: ${{ inputs.composition_id || 'Main' }}
      OUTPUT_NAME: ${{ inputs.output_name || 'final-video' }}
    defaults:
      run:
        working-directory: remotion
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clear previous local render files
        run: |
          rm -rf out
          mkdir -p out

      - name: Install dependencies
        run: npm install

      - name: Confirm Remotion versions
        run: |
          npm ls remotion @remotion/cli
          node -e "const r=require('remotion/package.json').version; const c=require('@remotion/cli/package.json').version; if(r !== '4.0.544' || c !== '4.0.544') process.exit(1); console.log('Remotion and CLI:', r)"

      - name: Install Remotion browser
        run: npx remotion browser ensure

      - name: List available compositions
        run: npx remotion compositions src/index.jsx

      - name: Render iPhone-ready MP4 in one encoding pass
        run: |
          npx remotion render src/index.jsx "$COMPOSITION_ID" "out/$OUTPUT_NAME-iPhone-compatible.mp4" \
            --codec=h264 \
            --crf=16 \
            --x264-preset=slow \
            --pixel-format=yuv420p \
            --audio-codec=aac \
            --audio-bitrate=192K \
            --gl=swangle \
            --preferred-effect-backend=webgpu

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Fill black bars with blurred scene background
        run: |
          INPUT="out/$OUTPUT_NAME-iPhone-compatible.mp4"
          FIXED="out/$OUTPUT_NAME-iPhone-compatible-fixed.mp4"
          ffmpeg -y -i "$INPUT" \
            -filter_complex "[0:v]split=2[fgsrc][bgsrc];[fgsrc]crop=1080:1238:0:340[fg];[bgsrc]crop=1080:1238:0:340,scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,boxblur=35:12[bg];[0:v][bg]overlay=0:0:enable='gte(t,1.5)'[base];[base][fg]overlay=0:340:enable='gte(t,1.5)'[v]" \
            -map "[v]" -map 0:a:0 \
            -c:v libx264 -profile:v high -level 4.1 -preset slow -crf 17 \
            -pix_fmt yuv420p -r 30 -c:a copy -movflags +faststart "$FIXED"
          mv "$FIXED" "$INPUT"

      - name: Upload final iPhone-ready video
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_NAME }}-iphone-final
          path: remotion/out/${{ env.OUTPUT_NAME }}-iPhone-compatible.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Remove unused source files after successful render
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const referenced = new Set();

            async function scan(path) {
              const response = await github.rest.repos.getContent({ owner, repo, path });
              const entries = Array.isArray(response.data) ? response.data : [response.data];
              for (const entry of entries) {
                if (entry.type === "dir") {
                  await scan(entry.path);
                } else if (entry.type === "file" && /\.(js|jsx|ts|tsx|json)$/.test(entry.name)) {
                  const file = await github.rest.repos.getContent({ owner, repo, path: entry.path });
                  const source = Buffer.from(file.data.content, "base64").toString("utf8");
                  for (const match of source.matchAll(/videos\/([^"'\s)]+)/g)) {
                    referenced.add(match[1]);
                  }
                }
              }
            }

            await scan("remotion/src");
            const directory = await github.rest.repos.getContent({
              owner, repo, path: "remotion/public/videos"
            });
            for (const file of directory.data) {
              if (
                file.type === "file" &&
                file.name !== ".gitkeep" &&
                !referenced.has(file.name)
              ) {
                await github.rest.repos.deleteFile({
                  owner,
                  repo,
                  path: file.path,
                  message: "Clean unused Remotion source asset after successful render",
                  sha: file.sha,
                  branch: context.ref.replace("refs/heads/", "")
                });
                core.info(`Removed unused source asset: ${file.name}`);
              }
            }

      - name: Remove older Remotion render artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const currentRun = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });
            const currentArtifactIds = new Set(
              currentRun.data.artifacts
                .filter(a => a.name.endsWith("-iphone-final"))
                .map(a => a.id)
            );

            const all = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );

            for (const artifact of all) {
              if (
                artifact.name.endsWith("-iphone-final") &&
                !currentArtifactIds.has(artifact.id)
              ) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id
                });
                core.info(`Deleted previous render artifact: ${artifact.name}`);
              }
            }

      - name: Clean local render output
        if: always()
        run: rm -rf out

      - name: Report output
        run: echo "Render uploaded; older Remotion render artifacts and local output files were cleaned."
