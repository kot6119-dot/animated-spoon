name: Проверка подключения Kaggle

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Подготовка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установка Kaggle CLI
        run: python -m pip install --upgrade kaggle six

      - name: Проверка доступа к Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "KAGGLE_API_TOKEN secret is missing."
            exit 1
          fi
          kaggle kernels list --mine --page-size 5
