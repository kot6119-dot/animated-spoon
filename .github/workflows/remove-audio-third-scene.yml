name: Remove audio from third scene

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/remove-audio-third-scene.yml'

permissions:
  contents: write

jobs:
  remove-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Remove audio only, keep video stream unchanged
        run: |
          set -euo pipefail
          input="remotion/public/videos/03-scena-tretya.mp4"
          output="/tmp/03-scena-tretya-no-audio.mp4"
          test -s "$input"
          ffmpeg -y -i "$input" -map 0:v:0 -c:v copy -an -movflags +faststart "$output"
          mv "$output" "$input"
          if ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$input" | grep -q .; then
            echo "Audio stream still present"
            exit 1
          fi
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,duration -of default=noprint_wrappers=1 "$input"

      - name: Commit only the processed third-scene video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add remotion/public/videos/03-scena-tretya.mp4
          git commit -m "Remove audio from third scene video"
          git push
