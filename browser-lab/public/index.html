<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Браузер для Kaggle</title>
<style>
:root{color-scheme:dark;font:17px -apple-system,BlinkMacSystemFont,sans-serif}
body{margin:0;background:#101827;color:#eef2f7;padding:18px}
main{max-width:900px;margin:auto}
input,button{box-sizing:border-box;width:100%;padding:13px;margin:7px 0;border-radius:9px;border:1px solid #64748b;background:#1e293b;color:white;font:inherit}
button{background:#d7e8ff;color:#102033;font-weight:700}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#screen{width:100%;display:block;border:1px solid #64748b;border-radius:8px;touch-action:manipulation}
#state{padding:10px 0;line-height:1.5}
small{color:#bac7d8}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1e293b;padding:12px;border-radius:8px;max-height:260px;overflow:auto}
</style>
</head>
<body><main>
<h1>Браузер Kaggle</h1>
<p>Пробный удалённый браузер. Сначала введи секретный ключ доступа, затем открой Kaggle и войди в аккаунт прямо в окне ниже.</p>
<label for="token">Ключ доступа</label>
<input id="token" type="password" autocomplete="off" placeholder="Ключ задаётся владельцем сервера">
<label for="url">Адрес сайта</label>
<input id="url" value="https://www.kaggle.com/" inputmode="url">
<button id="kaggleLogin">Войти в Kaggle</button>
<div class="row"><button id="open">Открыть сайт</button><button id="refresh">Обновить экран</button></div>
<div id="state" role="status">Браузер ещё не запущен.</div>
<img id="screen" alt="Снимок окна удалённого браузера">
<p><small>Нажимай по изображению, чтобы кликнуть в соответствующем месте браузера.</small></p>
<label for="typing">Текст для ввода в выбранное поле</label>
<input id="typing" placeholder="Текст для ввода">
<div class="row"><button id="type">Ввести текст</button><button id="enter">Нажать Enter</button></div>
<div class="row"><button id="tab">Tab</button><button id="esc">Escape</button></div>
<button id="read">Прочитать текст страницы</button>
<pre id="pageText">Здесь появится текст страницы.</pre>
</main>
<script>
const $=id=>document.getElementById(id);
const state=$("state");
function headers(){return {Authorization:"Bearer "+$("token").value,"Content-Type":"application/json"}}
async function call(url,options={}){const r=await fetch(url,{...options,headers:headers()});const j=options.raw?null:await r.json();if(!r.ok)throw Error(j?.error||"Ошибка "+r.status);return j}
function say(s){state.textContent=s}
async function refresh(){try{const r=await fetch("/api/screenshot",{headers:headers()});if(!r.ok){const j=await r.json();throw Error(j.error||"Ошибка "+r.status)}$("screen").src=URL.createObjectURL(await r.blob());const s=await call("/api/status");say("Открыто: "+s.title+" · "+s.url)}catch(e){say(e.message)}}
$("open").onclick=async()=>{try{const r=await call("/api/open",{method:"POST",body:JSON.stringify({url:$("url").value})});say("Открыта страница: "+r.title);await refresh()}catch(e){say(e.message)}};
$("kaggleLogin").onclick=async()=>{const loginUrl="https://www.kaggle.com/account/login";$("url").value=loginUrl;try{const r=await call("/api/open",{method:"POST",body:JSON.stringify({url:loginUrl})});say("Открыта страница входа Kaggle: "+r.title);await refresh()}catch(e){say("Не удалось открыть вход Kaggle: "+e.message)}};
$("refresh").onclick=refresh;
$("screen").onclick=async e=>{const r=$("screen").getBoundingClientRect();const x=(e.clientX-r.left)/r.width*1280;const y=(e.clientY-r.top)/r.height*800;try{await call("/api/click",{method:"POST",body:JSON.stringify({x,y})});await new Promise(r=>setTimeout(r,500));await refresh()}catch(err){say(err.message)}};
$("type").onclick=async()=>{try{await call("/api/type",{method:"POST",body:JSON.stringify({text:$("typing").value})});await refresh()}catch(e){say(e.message)}};
async function press(key){try{await call("/api/press",{method:"POST",body:JSON.stringify({key})});await refresh()}catch(e){say(e.message)}}
$("enter").onclick=()=>press("Enter");$("tab").onclick=()=>press("Tab");$("esc").onclick=()=>press("Escape");
$("read").onclick=async()=>{try{const r=await call("/api/read");$("pageText").textContent=r.title+"\n"+r.url+"\n\n"+r.text;say("Текст страницы прочитан.")}catch(e){say(e.message)}};
</script>
</body></html>
